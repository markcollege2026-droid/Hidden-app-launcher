name: Build Hidden Launcher

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      gists: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version || echo "sdkmanager missing"
          yes | sdkmanager --licenses 2>&1 | tail -5 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -20

      - name: Verify release keystore
        run: |
          ls -lh app/release.keystore || echo "No release keystore found!"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests (with log capture)
        id: unit_tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log
          echo "Exit code: ${PIPESTATUS[0]}" >> /tmp/test.log
          exit ${PIPESTATUS[0]}

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "=== Gradle cache? ==="
          ls -lh app/build/intermediates/ 2>&1 | head -20
          echo "=== Test log tail ==="
          tail -n 200 /tmp/test.log
          echo "=== Test XML if exists ==="
          cat app/build/test-results/testDebugUnitTest/*.xml 2>&1 | head -n 100 || echo "No XML"
          echo "=== Assemble debug for compile errors ==="
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -n 100 || true

      - name: Upload test log to Gist for debugging
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/test.log ]; then
            # Truncate to 500 lines for gist
            tail -n 500 /tmp/test.log > /tmp/gist.log
            gh gist create --public /tmp/gist.log --desc "Test log ${{ github.sha }} $(date)" 2>&1 | head -20 || echo "Gist failed"
          fi

      - name: Lint check
        if: always()
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        if: always()
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release APK
        if: always()
        run: ./gradlew assembleRelease --stacktrace

      - name: APK size & signing info
        if: always()
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk 2>&1 | head
          ls -lh app/build/outputs/apk/release/*.apk 2>&1 | head

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload signed release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-launcher-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
