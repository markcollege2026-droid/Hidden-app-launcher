name: Build Hidden Launcher

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version || echo "sdkmanager missing"
          yes | sdkmanager --licenses 2>&1 | tail -5 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -20

      - name: Verify release keystore
        run: |
          ls -lh app/release.keystore || echo "No release keystore found!"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log; exit ${PIPESTATUS[0]}

      - name: Diagnostics on failure (post commit comment)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Test log tail ==="
          tail -n 200 /tmp/test.log > /tmp/tail.log
          cat /tmp/tail.log
          echo "=== Posting commit comment with log ==="
          # Prepare JSON-escaped body
          LOG=$(tail -n 150 /tmp/test.log | sed 's/"/\\"/g' | head -c 60000)
          JSON=$(printf '{"body":"Test failure for %s:\n```\n%s\n```"}' "${{ github.sha }}" "$LOG")
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$JSON" "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" 2>&1 | head -20 || echo "Comment post failed"
          # Also try to run assemble for compile error details
          echo "=== Assemble debug ==="
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -n 100 || true

      - name: Lint check
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: APK size & signing info
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk 2>&1 | head
          ls -lh app/build/outputs/apk/release/*.apk 2>&1 | head
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk 2>&1 | head -20 || true
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hidden-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: hidden-launcher-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
