name: Build Hidden Launcher

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub release from this build'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag to create (e.g. v1.0)'
        type: string
        required: false
        default: 'v1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version || echo "sdkmanager missing"
          yes | sdkmanager --licenses 2>&1 | tail -5 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -20

      - name: Verify release keystore
        run: |
          ls -lh app/release.keystore || echo "No release keystore found!"
          if [ -f app/release.keystore ]; then
            echo "Release keystore present"
            openssl pkcs12 -info -in app/release.keystore -passin pass:hidden123 -nokeys -noout 2>&1 | head -20 || echo "Cannot inspect with openssl, but file exists"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint check
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Unit test & lint summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          from collections import Counter

          total = failures = errors = skipped = 0
          for path in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              print(f"{root.get('name')}: {root.get('tests')} tests, "
                    f"{root.get('failures')} failures, {root.get('errors')} errors")
          print(f"TOTAL: {total} tests, {failures} failures, {errors} errors, {skipped} skipped")
          print(f"::notice title=unit-tests::{total} unit tests, {failures} failures, {errors} errors, {skipped} skipped")
          if total == 0:
              raise SystemExit("No unit tests were executed!")

          lint_path = 'app/build/reports/lint-results-debug.xml'
          # Also expose the totals as a check annotation so they are visible without
          # downloading artifacts or reading raw logs.
          try:
              issues = ET.parse(lint_path).getroot().findall('issue')
              print(f"LINT: {len(issues)} issues {dict(Counter(i.get('severity') for i in issues))}")
              for issue in issues:
                  location = issue.find('location')
                  where = location.get('file') if location is not None else '?'
                  line = location.get('line') if location is not None else '?'
                  print(f"  [{issue.get('severity')}] {issue.get('id')} at {where}:{line} - {issue.get('message')}")
          except Exception as exc:
              print(f"No lint report parsed: {exc}")
          PY

      - name: Fail on lint errors
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = 'app/build/reports/lint-results-debug.xml'
          try:
              issues = ET.parse(path).getroot().findall('issue')
          except Exception as exc:
              raise SystemExit(f"Lint report missing, lint did not run: {exc}")

          errors = [i for i in issues if i.get('severity') == 'Error']
          print(f"Lint issues: {len(issues)} total, {len(errors)} errors")
          for issue in issues:
              location = issue.find('location')
              where = location.get('file') if location is not None else '?'
              line = location.get('line') if location is not None else '?'
              print(f"  [{issue.get('severity')}] {issue.get('id')} at {where}:{line} - {issue.get('message')}")
          for issue in errors[:10]:
              location = issue.find('location')
              where = location.get('file') if location is not None else '?'
              line = location.get('line') if location is not None else '?'
              message = (issue.get('message') or '').replace('%', '%25').replace('\n', ' ')
              print(f"::error title=lint:{issue.get('id')}::{message} ({where}:{line})")
          if errors:
              raise SystemExit(f"{len(errors)} lint error(s) found")
          PY

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/build/reports/lint-results-debug.*
          retention-days: 30

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify AppLock exemption (merged manifest + APKs)
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          NS = '{http://schemas.android.com/apk/res/android}'
          MARKER = 'dev.pranav.applock.AUTOLOCK_EXEMPT'
          problems = []
          verified = []

          merged = [
              p for p in glob.glob('app/build/intermediates/**/AndroidManifest.xml', recursive=True)
              if 'merged_manifest' in p
          ]
          if not merged:
              problems.append('no merged manifest found under app/build/intermediates')
          for path in sorted(merged):
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:
                  problems.append(f'{path}: invalid XML ({exc})')
                  continue
              application = root.find('application')
              entries = [] if application is None else [
                  m for m in application.findall('meta-data')
                  if m.get(NS + 'name') == MARKER
              ]
              if not entries:
                  problems.append(f'{path}: marker missing')
              elif len(entries) > 1:
                  problems.append(f'{path}: marker declared {len(entries)} times')
              elif entries[0].get(NS + 'value') != 'true':
                  problems.append(
                      f'{path}: marker value is {entries[0].get(NS + "value")!r}, expected "true"'
                  )
              else:
                  verified.append(f'merged manifest {path}')

          aapt2 = os.path.join(os.environ.get('ANDROID_HOME', ''), 'build-tools', '34.0.0', 'aapt2')
          apks = sorted(glob.glob('app/build/outputs/apk/**/*.apk', recursive=True))
          if not apks:
              problems.append('no APKs found under app/build/outputs/apk')
          for apk in apks:
              if os.path.getsize(apk) == 0:
                  problems.append(f'{apk}: empty file')
                  continue
              try:
                  dump = subprocess.run(
                      [aapt2, 'dump', 'xmltree', apk, '--file', 'AndroidManifest.xml'],
                      check=True, capture_output=True, text=True
                  ).stdout
              except Exception as exc:
                  problems.append(f'{apk}: aapt2 dump failed ({exc})')
                  continue
              blocks = []
              current = None
              for raw_line in dump.splitlines():
                  line = raw_line.strip()
                  if line.startswith('E: '):
                      current = [line] if line.startswith('E: meta-data') else None
                      if current is not None:
                          blocks.append(current)
                  elif current is not None and line.startswith('A: '):
                      current.append(line)
                  elif not line:
                      current = None
              candidates = [b for b in blocks if any(MARKER in line for line in b)]
              if not candidates:
                  problems.append(f'{apk}: marker missing from packaged manifest')
              elif not any(
                  re.search(r':value\([^)]*\)="true"', line)
                  for block in candidates for line in block
              ):
                  problems.append(f'{apk}: marker value is not boolean true in packaged manifest')
              else:
                  verified.append(f'APK {apk}')

          for item in verified:
              print(f'::notice title=applock-exemption::verified in {item}')
          if problems:
              for item in problems:
                  print(f'::error title=applock-exemption::{item}')
              raise SystemExit(1)
          print(f'::notice title=applock-exemption::exemption verified in {len(verified)} target(s)')
          PY

      - name: APK size & signing info
        run: |
          echo "=== Debug APK ==="
          ls -lh app/build/outputs/apk/debug/*.apk
          du -h app/build/outputs/apk/debug/*.apk
          echo "=== Release APK (signed) ==="
          ls -lh app/build/outputs/apk/release/*.apk
          du -h app/build/outputs/apk/release/*.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk 2>&1 | head -50 || echo "apksigner verify attempted"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hidden-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: hidden-launcher-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    # Only publishes when explicitly dispatched with publish_release=true, and only
    # after the build job (tests, lint, APK builds, manifest verification) succeeded.
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built APKs from this run
        uses: actions/download-artifact@v4
        with:
          pattern: hidden-launcher-*
          path: release-assets
          merge-multiple: true

      - name: Verify artifacts
        run: |
          set -euo pipefail
          ls -lh release-assets
          test -s release-assets/app-release.apk
          test -s release-assets/app-debug.apk
          echo "Built from commit: $GITHUB_SHA"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "release_tag input is required"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - refusing to overwrite it"
            exit 1
          fi
          mkdir -p dist
          cp release-assets/app-release.apk "dist/hidden-launcher-${TAG}-release.apk"
          cp release-assets/app-debug.apk "dist/hidden-launcher-${TAG}-debug.apk"
          cat > NOTES.md <<'EOF'
          Hidden Launcher for Android 11-14 (API 30-34), designed to be triggered by Keymapper.

          Highlights
          - Shows only the apps you select; grouped folders with drag-and-drop, folder animations and rename/merge/ungroup.
          - Fast startup and refresh: skeleton tiles instead of an empty-screen flash, metadata queried only for selected apps, progressive icon loading, shared icon LruCache, tiny persistent metadata cache and coalesced refreshes.
          - AppLock opt-out: declares the `dev.pranav.applock.AUTOLOCK_EXEMPT` application metadata marker so compatible AppLock implementations skip automatic protection/enrollment of the launcher.

          Assets
          - `hidden-launcher-TAG-release.apk` - signed release APK (demo keystore committed in the repository; not for Play Store publishing).
          - `hidden-launcher-TAG-debug.apk` - debug APK.

          Requirements: Android 11+ (API 30), no permissions, fully offline.
          EOF
          sed -i "s/TAG/${TAG}/g" NOTES.md
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Hidden Launcher ${TAG}" \
            --notes-file NOTES.md
