name: Build Hidden Launcher

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        run: |
          sdkmanager --version || echo "sdkmanager missing"
          yes | sdkmanager --licenses 2>&1 | tail -5 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -20

      - name: Verify release keystore
        run: ls -lh app/release.keystore || echo "No keystore"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile debug (capture log)
        id: compile
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/compile.log; exit ${PIPESTATUS[0]}

      - name: Post compile failure
        if: failure() && steps.compile.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Full compile log grep e: ===" > /tmp/compile_grep.log
          grep -n "e:\|error:" /tmp/compile.log | head -n 100 >> /tmp/compile_grep.log || echo "No grep match" >> /tmp/compile_grep.log
          cat /tmp/compile.log | head -n 500 >> /tmp/compile_grep.log
          tail -n 200 /tmp/compile.log >> /tmp/compile_grep.log
          BODY=$(cat /tmp/compile_grep.log | head -c 50000)
          jq -n --arg body "Compile failure $GITHUB_SHA:
          \`\`\`
          $BODY
          \`\`\`" '{body: $body}' > /tmp/payload.json
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d @/tmp/payload.json "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" | head -20 || echo "post failed"

      - name: Run unit tests
        if: success()
        id: unit_tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee /tmp/test.log; exit ${PIPESTATUS[0]}

      - name: Post test failure
        if: failure() && steps.unit_tests.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -n "FAILED\|e:\|error:" /tmp/test.log | head -n 100 > /tmp/test_grep.log
          cat /tmp/test_grep.log
          BODY=$(cat /tmp/test_grep.log | head -c 50000)
          jq -n --arg body "Test failure $GITHUB_SHA:
          \`\`\`
          $BODY
          \`\`\`" '{body: $body}' > /tmp/payload.json
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d @/tmp/payload.json "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" | head -20 || echo "post failed"

      - name: Lint check
        if: always()
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        if: success() || steps.unit_tests.outcome == 'success'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build signed release APK
        if: success() || steps.unit_tests.outcome == 'success'
        run: ./gradlew assembleRelease --stacktrace

      - name: APK size & signing info
        if: always()
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk 2>&1 | head
          ls -lh app/build/outputs/apk/release/*.apk 2>&1 | head

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload signed release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-launcher-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn
